# Depth is counted in parseSubCommands: a command parsed at nesting n that
# opens a block calls parseSubCommands(n+1), whose first act is to reject
# n+1 >= 64. Top-level commands are parsed at nesting 0, so the deepest
# well-formed file holds 64 command levels (nesting 0..63) and is opened by 63
# braces: the 64th `{`, the one that would introduce nesting 64, is the first
# one rejected.
