# A block must span three lines: the EBNF is
#   block := "{" newline command+ newline "}"
# so the `{` must be followed by a newline and the `}` must sit on its own line.
#
# The braces are separated by a space on purpose: the lexer treats braces as
# ordinary characters (it has to, or `{args[0]}` could not be one token), so a
# structural brace is a token whose text is exactly "{" — `{}` written with no
# space would be a single token and a plain argument instead. With the space, the
# rule that fires is "`{` must be followed by a newline".
dns {
    servers { }
}
