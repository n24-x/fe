# A block must hold at least one command — the EBNF is
#   block := "{" newline command+ newline "}"
# so this three-line but empty form is rejected.
#
# It has to be, because otherwise it would produce exactly the same Command as
# the block-less `dns {\n    servers\n}`: zero SubCommands either way, so nothing
# downstream could tell the two apart.
dns {
    servers {
    }
}
