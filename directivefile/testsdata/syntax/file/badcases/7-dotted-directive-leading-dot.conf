# A directive must START with a letter: the dot is a name character only
# AFTER the first one. A bare namespace tail is therefore rejected instead of
# being read as a nested name.
#
# Expected: reported at the directive, i.e.
#   .../7-dotted-directive-leading-dot.conf:8:1
#     syntax: invalid directive: .dns
.dns {
    upstream 1.1.1.1
}
