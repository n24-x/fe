# A trailing dot leaves the last segment empty, and an empty segment is
# never a namespace: a namespace is built by JOINING a parent onto a child
# (module_extend_rules.md: 子命令解析键 = 父的 Namespace + "." + cmd.Directive), so that
# rule can never produce one.
#
# Expected: reported at the directive, i.e.
#   .../8-dotted-directive-trailing-dot.conf:9:1
#     syntax: invalid directive: dns.
dns. {
    upstream 1.1.1.1
}
