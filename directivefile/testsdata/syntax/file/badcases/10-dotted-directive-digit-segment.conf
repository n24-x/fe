# Every dot-separated segment must itself be an identifier: a leading letter,
# then letters, digits, `_` and `-`. So a segment may not START with a digit,
# and (same rule) not with `-` either — `dns.-x` is rejected too.
#
# The characters are all legal LATER in a segment, which is the point: `dns.2x`
# is a typo, `dns.srv2` is a name.
#
# Expected: reported at the directive, i.e.
#   .../10-dotted-directive-digit-segment.conf:11:1
#     syntax: invalid directive: dns.2x
dns.2x {
    upstream 1.1.1.1
}
