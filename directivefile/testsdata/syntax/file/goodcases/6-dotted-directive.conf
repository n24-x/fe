# A directive may be namespaced. fe/module.go calls a module id a "namespaced,
# dot-separated" identifier, and module_extend_rules.md lets a sub-module spell its
# namespace out instead of relying on the parent's — so a dot has to be a legal
# name character.
#
# It is just that, not punctuation: the lexer splits on white space only, so
# `dns.forwarder` is ONE token, never `dns` followed by `.forwarder`.
#
# Both places that take a directive accept a dotted name: the top level (a
# ModuleDirective may be fully qualified) and inside a block (a sub-module may
# name its namespace explicitly).
dns.forwarder {
    upstream 1.1.1.1
}

endpoint {
    endpoint.http.proxy {
        to 127.0.0.1:8080
    }
}
