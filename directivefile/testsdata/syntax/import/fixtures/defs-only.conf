# A file holding ONLY a template definition.
#
# It is legal as a MAIN file (parseFile accepts it: the definition counts), but
# rejected when IMPORTED — templates do not cross files, so this file would
# contribute nothing to the importer's command tree.
#
# That rejection happens later than the empty-file one (in expandImports rather
# than parseFile), so its message points at the IMPORT LINE instead of at this
# file, and carries line:column info.
(lib) {
    inner
}
