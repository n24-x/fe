# Imports a file that defines a template but holds no command. The definition
# cannot travel across files, so the import contributes nothing and is rejected.
#
# Contrast badcases/3-import-empty-file.conf: the EMPTY file is caught earlier
# (inside parseFile, which does not know who imported it) and its message names
# the imported file with no line info; this defs-only file passes that check
# because the definition counts, so expandImports catches it HERE instead.
#
# Expected: reported at THIS import line (line 13), i.e.
#   .../4-import-defs-only-file.conf:13:1:
#     syntax: imported file ".../fixtures/defs-only.conf" must contain at least one command
start
import ../fixtures/defs-only.conf
end
