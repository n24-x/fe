# Imports a file that contributes no command. An empty file (or a comments-only
# one) yields zero commands, which is rejected — otherwise the enclosing block
# could silently become empty.
#
# Expected: reported at the IMPORTED FILE, without line info:
#   syntax: file .../fixtures/empty.conf must contain at least one command
#
# (A defs-only file takes the other path: parseFile accepts it because the
# definition counts, and expandImports then reports at the import line.)
nonempty
import ../fixtures/empty.conf
