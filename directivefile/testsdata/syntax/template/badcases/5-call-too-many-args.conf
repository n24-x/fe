# The mirror of 4-call-too-few-args.conf: the template declares arity 2, so a
# third argument would be silently dropped if this were allowed.
#
# Expected: reported at the CALL, i.e.
#   .../5-call-too-many-args.conf:12:1:
#     syntax: template "proxy" expects 2 arguments, got 3
(proxy) {
    forward {args[0]}
    header {args[1]}
}

tmpl proxy one two three
