# Arity is fixed by the definition (2 here: {args[0]} and {args[1]}), and a call
# must supply exactly that many. Too few leaves a placeholder unresolved.
#
# Expected: reported at the CALL, i.e.
#   .../4-call-too-few-args.conf:12:1:
#     syntax: template "proxy" expects 2 arguments, got 1
(proxy) {
    forward {args[0]}
    header {args[1]}
}

tmpl proxy only-one
