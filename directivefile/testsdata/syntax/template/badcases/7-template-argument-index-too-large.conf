# The template argument index is capped at maxTemplateArity = 32: legal indices
# are 0..31, so a template's arity is at most 32. An index >= 32 is rejected
# while the BODY is analysed, and that bound is what keeps make([]bool, arity)
# from being sized by a number the author picks.
#
# 32 is the first illegal index, so this case pins the boundary from the wrong
# side: with `>` instead of `>=` in parseTemplateArg, {args[32]} would be
# accepted and arity would become 33.
#
# The placeholder sits in a TEMPLATE BODY, so the error points at the command
# that holds it -- not at the definition and not at a call site.
#
# Expected: reported at the command holding the placeholder, i.e.
#   .../7-template-argument-index-too-large.conf:17:5
#     syntax: template argument index is too large: {args[32]}
(t) {
    cmd {args[32]}
}
