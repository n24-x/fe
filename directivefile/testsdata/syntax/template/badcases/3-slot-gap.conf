# Slot indices must be contiguous from 0: index 1 is used by nobody while 0 and
# 2 are, so the caller would have to pass a value that no command ever reads.
#
# Expected: reported at the definition, i.e.
#   .../3-slot-gap.conf:7:1:
#     syntax: template argument 1 is missing
(t) {
    a {args[0]}
    b {args[2]}
}
