# A `tmpl` call is `tmpl <name> <args...>` and has no block. A block here must
# be rejected BEFORE the call is replaced — otherwise the whole command,
# including the block, is spliced away and its contents vanish silently.
#
# Expected: reported at the call, i.e.
#   .../2-call-with-block.conf:12:1:
#     syntax: tmpl command cannot have a block
(proxy) {
    forward {args[0]}
}

tmpl proxy {
    this {
        should {
            not {
                vanish
            }
        }
    }
}
