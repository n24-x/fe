# A name may not start with a digit. This is NOT an error: the token fails the
# `{$NAME}` shape test, so it is kept verbatim as an ordinary argument.
#
# Names must match [A-Za-z_][A-Za-z0-9_]*, so `{$1}` is only ever a literal.
#
# Expected: OK, cmd.Args == ["{$1}"] — the text is passed through unchanged.
cmd {$1}
