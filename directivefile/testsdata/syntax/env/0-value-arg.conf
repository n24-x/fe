# Requires: DF_TEST_ENV_VALUE is set to a non-empty value (e.g. "223.5.5.5").
#
# The positive case: substitution really happens. Without it the suite would
# only cover the failing paths (not-set / empty) and the literal paths, and a
# build where substitution never fires would still look green.
#
# The value becomes EXACTLY ONE argument.
#
# Expected: OK, cmd.Args == ["<the value>"]
cmd {$DF_TEST_ENV_VALUE}
