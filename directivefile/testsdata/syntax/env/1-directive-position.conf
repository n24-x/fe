# An environment variable may only appear in an ARGUMENT position. Substitution
# happens while reading Args, so the directive token is never resolved — it goes
# straight to the directive-name check and fails.
#
# Note the variable IS set here: the rejection is about the POSITION, not about
# the value. `{$PROXY}` can never name a directive, set or not.
#
# Expected: reported at the placeholder itself, i.e.
#   .../1-directive-position.conf:10:1: syntax: invalid directive: {$PROXY}
{$PROXY} http
